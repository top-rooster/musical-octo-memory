name: Deploy Safe Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Capture build metadata
        shell: bash
        run: |
          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "SAFE_ROOM_BUILD_TIMESTAMP=$build_timestamp" >> "$GITHUB_ENV"
          echo "Safe Room Build ${GITHUB_RUN_NUMBER} · ${build_timestamp}"
          {
            echo "### Safe Room build metadata"
            echo "- Build number: ${GITHUB_RUN_NUMBER}"
            echo "- Build timestamp: ${build_timestamp}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build production application
        run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
